---
layout: fw
---
{% assign contact_ij=site.data.contact-ij %}
{% assign contact_yotm=site.data.contact-yotm%}
<div class="row">
    <div class="col-sm-6 col-md-6">
        <ul class="list-group list-group-flush card rounded mb-2">
            {% for item in contact_ij %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span><div class="btn btn-light"><i class="{{item.icon}}"></i></div></span>
                    {{item.text}}
                </li>
            {% endfor %}
        </ul>
    </div>
    <div class="col-sm-6 col-md-6">
        <ul class="list-group list-group-flush card rounded mb-2">
            {%for item in contact_yotm %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span><div class="btn btn-light"><i class="{{item.icon}}"></i></div></span>
                    {{item.text}}
                </li>
            {% endfor %}
        </ul>
    </div>
</div>
