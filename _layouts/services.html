---
layout: minimal
---
<h1 style="font-family: var(--font-main); font-weight: 400; margin-bottom: 2rem; opacity: 0.8;">
  {{page.title}}
</h1>
{% assign services = site.services %}
<div class="category-nav">
  {% for service in services %}
    <a class="cat-button" href="{{service.url | relative_url}}">
      <span class="cat-name">
        {{service.title}}
      </span>
     
        <i data-lucide="rocket"></i>
    </a>
  {% endfor %}
</div>
