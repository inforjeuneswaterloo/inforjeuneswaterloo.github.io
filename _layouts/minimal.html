<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <script src="https://kit.fontawesome.com/a03376f283.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{ '/assets/css/minimal.css' | relative_url }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  {% feed_meta %} 
  <noscript><p><img referrerpolicy="no-referrer-when-downgrade" src="https://analytics.inforjeuneswaterloo.be/matomo.php?idsite=2&amp;rec=1" style="border:0;" alt="" /></p></noscript>
</head>

<body>

  <main >
   <header class="site-header">
  <div class="header-spacer"></div>

  <div class="brand-container">
    <a href="{{ '/' | relative_url }}" class="logo-link">
      <img src="{{ '/assets/images/logos/ijw-banner-transparent.webp' | relative_url }}" alt="{{ site.title }}" class="site-logo">
    </a>
    <p class="site-slogan">{{ site.description }}</p>
  </div>

  <div class="nav-container">
    <input type="checkbox" id="menu-cb" class="menu-checkbox">
    <label for="menu-cb" class="hamburger">
      <span></span><span></span><span></span>
    </label>
    <label for="menu-cb" class="menu-overlay-screen"></label>
    <nav class="nav-overlay">
      <div class="nav-content">
        {% for item in site.data.minimal-main-nav %}
          <a href="{{item.url | relative_url}}">
            {{item.title}}
          </a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>

    {{ content }}

    <footer style="margin-top: 5rem; padding-top: 2rem; border-top: 1px solid rgba(128,128,128,0.1); font-size: 0.8rem; opacity: 0.5; font-family: sans-serif;">
        <p>&copy; {{ "now" | date: "%Y" }} — {{ site.title }}</p>
        <div class="container">
          <div class="partners-inner">
            <div class="partners-logos">
              <img src="/assets/images/logos/fwb-540.png" alt="Fédération Wallonie-Bruxelles">
              <img src="/assets/images/logos/waterloo.png" alt="Ville de Waterloo">
              <img src="/assets/images/yotm/logos/bij.png" alt="BIJ - Bureau International Jeunesse">
              <img src="/assets/images/yotm/logos/eurodesk-black.png" alt="Eurodesk Belgique">
            </div>
          </div>
        </div>
    </footer>
  </main>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>
<script src="{{'srcipts/matomo.js'}}"></script>
</body>
</html>
