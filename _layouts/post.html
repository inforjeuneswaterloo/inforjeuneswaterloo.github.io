---
layout: page
---
{% assign type=page.type | default:post %}
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
    {%if page.disclaimer.enabled %}
      <div class="alert alert-light mt-4 mb-2">
        {% include elements/disclaimer.html%}
      </div>
    {%endif%}
  </div>
</article>
