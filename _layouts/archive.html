---
layout: default # Ou le nom de votre layout de base
---

<div class="page">

  <h1 class="page-title">
    Actualités pour {{ page.date | date: "%B %Y" | capitalize }}
  </h1>

  <ul class="post-list">
    {% for post in page.posts %}
      <li>
        <span class="post-meta">{{ post.date | date: "%d %b, %Y" }}</span>
        <h3>
          <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h3>
      </li>
    {% endfor %}
  </ul>

</div>
