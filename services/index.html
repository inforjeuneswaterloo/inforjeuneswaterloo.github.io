---
layout: page
title: Services
permalink: /services/
---
{% assign items=site.services %}
<div class="d-flex flex-row-center">
    {% if items.size>0 %}
        {% for item in items %}
            <div class="item p-2">
                <a class="btn btn-dark text-white text-decoration-none btn-lg" href="{{item.url | relative_url}}">
                    {{item.icon.text}}&nbsp;<i class="{{item.icon.fa}}"></i>
                </a>
            </div>
        {% endfor %} 
    {% endif %}
</div>
