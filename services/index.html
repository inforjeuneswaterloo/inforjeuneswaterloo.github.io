---
layout: list
direction: horizontal
title: Services
permalink: /services/
listed: true
---
{% assign items=site.services %}
{% for item in items %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <span><h6 class="display">{{ item.title }}</h6></span>
        <a class="btn btn-light text-decoration-none" href="{{item.url | relative_url}}">
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </li>
{% endfor %}
