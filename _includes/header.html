<header role="banner">
  {% assign homepage_url='/'|relative_url %}
  {% assign list_collections=site.collections %}
  {% assign social_list=site.data.social %}
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom border-light-subtle ">
    <div class="container-fluid">
      {% assign topnav=site.data.top-nav %}
      <a class="navbar-brand btn btn-light text-perimary" href="/">
        <i class="fa-solid fa-home"></i>
      </a>
      <div class="d-flex justify-content-end">
          {% for item in topnav %}
            <a class="{{item.class}} {% if page.url contains item.url %}active{% endif %} text-decoration-none"  
            href="{{item.url | relative_url}}" type="button">
            {{item.title}}
          </a>
          {%endfor%}
          <a class=" navbar-brand btn btn-light text-decoration-none text-primary" href="/contact/">
            <i class="fa-solid fa-envelope"></i>
          </a>
      </div>
    </div>
  </nav>
</header>
