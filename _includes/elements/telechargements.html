{% assign item=include.item %}
{% assign text=include.text | default: false %}
<li class="list-group-item d-flex justify-content-between align-items-center">
    <span><h6 class="display">{{ item.title | markdownify }}</h6></span>
    <a class="btn btn-light text-decoration-none" href="{{item.url | relative_url}}">
            <i class="fa-solid fa-file-download"></i>
     </a>
</li>
