{% assign organismes=site.yotm %}
{% assign current_page=page.url %}
{% for organisme in organismes %}
     <div class="list-group mb-2">
        <a class="list-group-item list-group-item-action {%if organisme.url==page.url %}active{%endif%} text-decoration-none" href="{{organisme.url}}">
            <h4 class="display">
                {{organisme.title}}
            </h4>
        </a>
    </div>
{% endfor %}
