{% assign items=include.items %}
{% for item in items %}
    {%if page.url contains item.url %}
        {% assign active='active'%}
    {% endif %}
    <li class="nav-item">
        <a class="nav-link text-decoration-none {%if page.url contains item.url %}active{%endif%}" href="{{item.url | relative_url}}">
            {{item.title}}
        </a>
    </li>
{%endfor%}
