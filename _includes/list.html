{% assign items=include.collection %}
{% assign direction=page.direction %}
<ul class="list-group {{direction}} flex-fill">
    {% for item in items %}
        <li class="list-group-item">
            <a class="text-decoration-none" href="{{item.url | relative_url}}">
                {{item.title}}
            </a>
        </li>
    {% endfor %}
</ul>
