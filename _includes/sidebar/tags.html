{% assign categories=site.tags %}
{% for category in categories %}
    {% assign category_name= category | first %}
    {% assign category_slug=category_name | slugify %}
    {% assign posts_in_category =category | last %}
        <li class="list-group-item">
            <a class="text-decoration-none" href="{{'/categories/' | append:category_slug | '/'}}">
                    {{category_name}}&nbsp;({{posts_in_category.size}})
            </a>
        </li>
{% endfor %}
