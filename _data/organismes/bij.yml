title: "BIJ - Bureau International Jeunesse"
descri: "Le Bureau International Jeunesse est un service public de la Fédération Wallonie-Bruxelles qui aide les jeunes de 13 à 35 ans à financer leurs projets à l’étranger (hors cadre scolaire): apprendre une langue, faire un stage professionnel, vivre une expérience de volontariat et surtout découvrir d’autres cultures et réalités ! Seul ou en groupe. En Europe, au Québec, en Afrique ou ailleurs."
reco: Organisation de Jeunesse reconnue
