title: Rédiger son CV en anglais
author: CIDJ-Paris
descri: "Avant de postuler pour un emploi, un job d’été, un stage, un volontariat à l’étranger… informez-vous sur les usages du pays de destination en matière de CV. En effet, les normes des pays anglophones diffèrent de celles pratiquées chez nous."
