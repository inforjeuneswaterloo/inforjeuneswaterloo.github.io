
title-icon: "fa-solid fa-plane-departure"
email: info@inforjeuneswaterloo.be
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://yotm.netlify.app" # the base hostname & protocol for your site, e.g. http://example.com
title: Infor Jeunes Waterloo
description: "Informer. Autonomiser. Sans condition."
slugify_mode: ascii



#Pagination
pagination:
  enabled: true
  per_page: 5
  permalink: /page/:num
  sort_field: date
  sort_reverse: true 
  
#Collections
collections:
  services:
    output: true
    permalink: /services/:title/
  tesmoignages:
    output: true
    permalink: /temoignages/:title/
  telechargements:
    output: true
    permalink: /telechargements/:title/
  instapaper:
    output: true
    permalink: /instapaper/:path/

# Définir des valeurs par défaut pour les collections
defaults:
  # Appliquer ces valeurs à toutes les pages de la collection 'services'
  - scope:
      path: ""
      type: "services" # Nom de votre collection dans _config.yml
    values:
      show_post_nav: false # Nouvelle variable définie à 'false'
      show_post_title: false

  # Optionnel : Appliquer l'affichage par défaut (true) aux posts et autres collections
  - scope:
      path: ""
      type: "posts"
    values:
      show_post_nav: true
      show_post_title: true


# Build settings
permalink: /:title/
theme: minima

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-archives
  - jekyll-sitemap

jekyll-archives:
  enabled:
    - category
  layout: archive-category # On utilisera un layout nommé 'archive.html'
  permalinks:
    category: /category/:name/

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - venv/
sass:
  style: compressed
  quiet_deps: true

