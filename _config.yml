
title-icon: "fa-solid fa-plane-departure"
email: your-email@example.com
description: "Infor Jeunes est un Centre d'information jeunesse agréé et subventionné par la [Fédération Wallonie-Bruxelles](http://www.cfwb.be). L'ASBL est également soutenue par l'échevinat de la Jeunesse de la ville de [Waterloo](https://waterloo.be)"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#Buttons
buttons:
  jobs:
    href: '/job/'
    text: 'Voir toutes les offres de jobs'
    icon: 'bi bi-arrow-up-right'
    class: 'btn btn-black btn-sm text-white text-decoration-none'
  news:
    href: '/job/'
    text: 'Voir toutes les news'
    icon: 'bi bi-arrow-up-right'
    class: 'btn btn-black btn-sm text-white text-decoration-none'
  services:
    href: '/job/'
    text: 'Voir tous les services'
    icon: 'bi bi-arrow-up-right'
    class: 'btn btn-black btn-sm text-white text-decoration-none'
  posts:
    href: '/job/'
    text: 'Voir tous les articles'
    icon: 'bi bi-arrow-up-right'
    class: 'btn btn-black btn-sm text-white text-decoration-none'


#Pagination
pagination:
  enabled: true
  per_page: 5
  permalink: /page/:num
  sort_field: date
  sort_reverse: true 
  
#Collections
collections:
  jobs:
    output: true
    permalink: /jobs/:title
  news:
    output: true
    permalink: /news/:title
  services:
    output: true
    permalink: /services/:title

jekyll-archives:
  enabled:
    - months
    - years
  layout: archive # On utilisera un layout nommé 'archive.html'
  permalinks:
    years: '/archives/:year'
    month: '/archives/:year/:month/' # Structure de l'URL, ex: /archives/2025/05/


# Build settings
permalink: /:title/
theme: minima

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-archives 


