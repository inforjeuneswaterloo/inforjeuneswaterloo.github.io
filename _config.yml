
title-icon: "fa-solid fa-plane-departure"
email: info@inforjeuneswaterloo.be
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://inforjeuneswaterloo.be" # the base hostname & protocol for your site, e.g. http://example.com




#Pagination
pagination:
  enabled: true
  per_page: 5
  permalink: /page/:num
  sort_field: date
  sort_reverse: true 
  
#Collections
collections:
  services:
    output: true
    permalink: /services/:title/
  yotm:
    output: true
    permalink: /yotm/:title/




# Build settings
permalink: /:title/
theme: minima

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-archives
  - jekyll-sitemap

jekyll-archives:
  enabled:
    - category
  layout: archive-category # On utilisera un layout nommé 'archive.html'
  permalinks:
    category: /category/:name/

