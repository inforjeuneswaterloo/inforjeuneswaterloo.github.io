name: Mise à jour horaire

on:
  schedule:
    # Exécute toutes les heures, à la 0ème minute de chaque heure (UTC).
    # Pour Orp-Jauche (CEST - UTC+2 en été), cela correspondra à 2h00, 3h00, 4h00, etc. heure locale.
    - cron: '0 * * * *' 

  workflow_dispatch: # Permet de lancer ce workflow manuellement depuis l'onglet Actions

jobs:
  # Job unique: Met à jour les données, construit et déploie le site sur GitHub Pages
  update_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour modifier les fichiers (via git commit) et pour le déploiement
      pages: write    # Nécessaire pour déployer sur GitHub Pages
      id-token: write # Nécessaire pour l'authentification OIDC de GitHub Pages

    environment: # L'environnement de déploiement GitHub Pages
      name: github-pages 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère l'historique complet pour les opérations Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # La version de Python utilisée pour vos scripts

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Installe les dépendances nécessaires (suppression de pdfkit si PDF non généré)
          pip install requests python-frontmatter python-slugify pytz PyYAML atproto html2text 

      # --- Étape 1: Exécuter le script Mastodon Jobs ---
      # Ce script nettoie '_jobs/', récupère les posts Mastodon des 7 derniers jours et les crée dans '_jobs/'.
      # Note: La génération de 'scripts/temp_jobs_for_pdf.json' et le PDF ont été retirés du script jobs.py.
      - name: Run Mastodon Jobs script (job4student)
        run: python scripts/jobs.py 
        env:
          MASTODON_USERNAME: ${{ secrets.MASTODON_USERNAME }}
          MASTODON_PASSWORD: ${{ secrets.MASTODON_PASSWORD }}

      # --- Étape 2: Exécuter le script Bluesky Publisher ---
      # Ce script nettoie '_news/', récupère les posts Bluesky et les crée dans '_news/'.
      - name: Run Bluesky Publisher Script
        run: python scripts/bsky.py
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      # --- Étape 3: Commiter tous les changements effectués par les scripts ---
      # Ce commit est fait par le robot GitHub Actions.
      - name: Commit all content changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          # Ajoutez TOUS les dossiers que vos scripts peuvent modifier
          git add _jobs/ _news/ 
          git commit -m "Automatisation: Mise à jour horaire du contenu du site" || echo "No content changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Étape 4: Construire le site Jekyll ---
      # Le code est déjà à jour localement grâce au commit précédent.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.1' 
          bundler-cache: true 

      - name: Build Jekyll site
        run: bundle exec jekyll build

      # --- Étape 5: Déployer le site sur GitHub Pages ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4