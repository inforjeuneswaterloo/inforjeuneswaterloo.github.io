name: Mise à jour horaire

on:
  schedule:
    # Exécute toutes les heures, à la 0ème minute de chaque heure (UTC).
    - cron: '0 * * * *' 

  workflow_dispatch:

jobs:
  update_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter python-slugify pytz html2text atproto pyyaml feedparser

      - name: Run Mastodon News script
        run: python scripts/jobs.py
        env:
          MASTODON_USERNAME: ${{ secrets.MASTODON_USERNAME }}
          MASTODON_PASSWORD: ${{ secrets.MASTODON_PASSWORD }}

      - name: Rune Bluesky Job Timeline script
        run: scripts/bsky-job.py
        env:
          BLUESKY_JOB_USERNAME: ${{ secrets.BLUESKY_JOB_USERNAME }}
          BLUESKY_JOB_PASSWORD: ${{ secrets.BLUESKY_JOB_PASSWORD }}
          BLUESKY_JOB_DID_PLC: ${{ secrets.BLUESKY_JOB_DID_PLC }}

      - name: Run Bluesky Timeline script
        run: python scripts/bsky.py
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD}}
          BSKY_DID_PLC: ${{ secrets.BSKY_DID_PLC }}
      
      - name: Commit all content changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add _data/ categories/ 
          git commit -m "Automatisation: Mise à jour horaire du contenu du site" || echo "No content changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.1' 
          bundler-cache: true 

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_ROOT_USER }}
          password: ${{ secrets.FTP_ROOT_PASSWORD }}
          local-dir: ./_site/
          server-dir: ./
          state-name: .ftp-deploy-state
          protocol: ftp
          exclude: |
            .git/
            .github/
            .jekyll-cache/