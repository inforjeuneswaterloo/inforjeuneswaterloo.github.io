name: Mise à jour horaire

on:
  schedule:
    # Exécute toutes les heures, à la 0ème minute de chaque heure (UTC).
    - cron: '0 * * * *' 

  workflow_dispatch: # Permet de lancer ce workflow manuellement depuis l'onglet Actions

jobs:
  # Job unique: Met à jour les données, construit et déploie le site sur GitHub Pages
  update_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour modifier les fichiers (via git commit) et pour le déploiement
      pages: write    # Nécessaire pour déployer sur GitHub Pages
      id-token: write # Nécessaire pour l'authentification OIDC de GitHub Pages

    environment: # L'environnement de déploiement GitHub Pages
      name: github-pages 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère l'historique complet pour les opérations Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # La version de Python utilisée pour vos scripts

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Installe les dépendances nécessaires pour le script Mastodon (requests, frontmatter, slugify, html2text, pytz)
          # 'atproto' et 'PyYAML' ont été retirés car bsky.py est abandonné.
          pip install requests python-frontmatter python-slugify pytz html2text 

      # --- Étape 1: Exécuter le script Mastodon (news/jobs) ---
      # Ce script nettoie '_news/', récupère les posts Mastodon des 30 derniers jours et les crée dans '_news/'.
      - name: Run Mastodon News script
        run: python scripts/jobs.py # Mettez le nom exact de votre fichier (ex: jobs.py si c'est son nom)
        env:
          MASTODON_USERNAME: ${{ secrets.MASTODON_USERNAME }}
          MASTODON_PASSWORD: ${{ secrets.MASTODON_PASSWORD }}

      - name: Run Bluesky Timeline script
        run: python scripts/bsky.py
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }} # Assurez-vous que ce secret est configuré
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD}}
      
          # --- Étape 3: Commiter tous les changements effectués par les scripts ---
      # Ce commit est fait par le robot GitHub Actions.
      - name: Commit all content changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          # Ajoutez TOUS les dossiers que vos scripts peuvent modifier (ex: _news/ et _jobs/ si le script gère les deux)
          # Le dossier _data/ n'est plus ajouté ici si bsky.py est abandonné.
          git add _jobs/ _data/
          git commit -m "Automatisation: Mise à jour horaire du contenu du site" || echo "No content changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Étape 3: Construire le site Jekyll ---
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.1' 
          bundler-cache: true 

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5 # Utilisez la dernière version stable
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_site/ # Le dossier source local (le site Jekyll construit)
          remote-dir: web/waterloo # Le chemin de destination sur votre serveur FTP
          state-name: .ftp-deploy-state # Nom du fichier d'état pour le déploiement incrémental
          protocol: ftp # Ou 'ftps' pour FTPS, ou 'sftp' pour SFTP (nécessite un serveur SFTP configuré)
          exclude: | # Fichiers/dossiers à exclure du transfert FTP
            .git/
            .github/
            .jekyll-cache/
            # Ajoutez d'autres exclusions si nécessaire


      # --- Étape 4: Déployer le site sur GitHub Pages ---
      # Ces actions sont celles qui publient réellement sur GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4