# .github/workflows/update_site_hourly.yml
name: Mises à jour horaires du site et publication Mastodon

on:
  schedule:
    # Exécute toutes les heures, à la minute 0.
    # L'heure UTC est utilisée pour les cron jobs sur GitHub Actions.
    # Si vous voulez que ça tourne à 08:00 CEST (UTC+2), vous devez mettre '0 6 * * *' UTC.
    - cron: '0 15 * * *' 

  workflow_dispatch: # Permet de lancer le workflow manuellement depuis l'interface GitHub

jobs:
  # Job 1: Préparer les données (récupérer les posts Mastodon et les committer)
  prepare_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour que le script Python puisse modifier les fichiers Markdown

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère l'historique complet pour les opérations Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # Version de Python que vous utilisez

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter python-slugify html2text pytz

      - name: Run Mastodon post retrieval script
        # Assurez-vous que le fichier jobs.py est bien à la racine de votre dépôt
        run: python jobs.py 

      - name: Commit changes (new Mastodon posts)
        # Cette étape va committer les nouveaux fichiers .md créés par le script Python
        # et les pousser vers votre branche 'main'.
        # Ce push déclenchera ensuite le job 'build_and_deploy'.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add _jobs/ # Ajoutez les fichiers créés/modifiés dans le dossier _jobs
          git commit -m "Automatisation: Mise à jour des annonces Mastodon" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Utilise le jeton par défaut de GitHub Actions


  # Job 2: Construire et Déployer le site Jekyll sur GitHub Pages
  # Ce job attend que le job 'prepare_data' soit terminé et que les fichiers soient poussés.
  build_and_deploy:
    runs-on: ubuntu-latest
    needs: prepare_data # Ce job dépend de la réussite de 'prepare_data'
    
    # Configuration de l'environnement de déploiement GitHub Pages
    environment:
      name: github-pages # Nom d'environnement spécial requis par actions/deploy-pages
    
    # Permissions spécifiques pour le déploiement sur GitHub Pages
    permissions:
      contents: write # Nécessaire pour checkout et pour l'étape de déploiement
      pages: write    # Nécessaire pour déployer sur GitHub Pages
      id-token: write # Nécessaire pour l'authentification avec OIDC pour GitHub Pages

    steps:
      - name: Checkout code (after data preparation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour l'historique Git si vous faites des opérations de push

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.1' # Spécifiez une version de Ruby stable et disponible (ex: 3.3.1 ou 3.2.4)
          bundler-cache: true # Installe les dépendances Gemfile avec Bundler

      - name: Build Jekyll site
        # Cette étape exécute Jekyll avec tous vos plugins (même non supportés par GitHub Pages)
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        # Cette étape prend le site Jekyll déjà construit (_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site # Chemin du dossier Jekyll construit

      - name: Deploy to GitHub Pages
        # Cette étape déploie l'artefact statique sur GitHub Pages
        uses: actions/deploy-pages@v4