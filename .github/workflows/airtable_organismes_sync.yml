name: Build and Deploy Jekyll with Airtable Sync

on:
  push:
    branches:
      - design-minimaliste
  # Exécution automatique quotidienne (à minuit UTC) pour récupérer les nouveaux organismes
  schedule:
    - cron: '0 0 * * *'
  # Permet le déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Synchroniser les données Airtable
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          ruby scripts/sync_airtable.rb

      - name: Générer les fichiers de collections (_champs)
        run: |
          ruby scripts/generate_champs.rb

      - name: Build avec Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4