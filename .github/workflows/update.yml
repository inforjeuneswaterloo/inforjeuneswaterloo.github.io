name: Mise à jour quotidienne à 01h00

on:
  schedule:
    # Exécution tous les jours à 23:00 UTC (correspond à 01:00 heure locale UTC+2)
    - cron: '0 23 * * *'

  workflow_dispatch: # Permet de lancer la mise à jour manuellement

jobs:
  ping-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Build Hook
        run: curl -X POST -d {} "https://api.netlify.com/build_hooks/6a049c6c5a5eb6a6785dd85b"
