name: Mise à jour quotidienne à 01h00

on:
  schedule:
    # Exécution tous les jours à 23:00 UTC (01:00 heure d'été UTC+2 / 00:00 heure d'hiver UTC+1)
    - cron: '0 23 * * *'

  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          ref: design-minimaliste # Force l'alignement immédiat sur la branche main

      - name: Configuration de Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # Installe automatiquement les gemmes nécessaires du Gemfile

      - name: Exécution du script Instapaper
        run: |
          ruby scripts/fetch_instapaper.rb

      - name: Nettoyage des fichiers temporaires
        run: |
          rm -rf .bundle/config

      - name: Commit et Push des modifications s'il y en a
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: mise à jour automatique Instapaper [skip ci]"
          file_pattern: "_data/*.yml"
          branch: main

      - name: Trigger Netlify Build Hook
        run: |
          curl -X POST -d {} "https://api.netlify.com/build_hooks/6a049c6c5a5eb6a6785dd85b"