# .github/workflows/bluesky_frequent_publisher.yml
# .github/workflows/update_site_daily.yml
name: Mise à jour quotidienne (Jobs Mastodon) & Déploiement du Site

on:
  schedule:
    # Exécute tous les jours à 15h00 UTC (correspond à 17h00 CEST en été, 16h00 CET en hiver)
    # L'heure des cron jobs GitHub Actions est toujours en UTC.
    - cron: '0 15 * * *' 

  workflow_dispatch: # Permet de lancer ce workflow manuellement

jobs:
  # Job 1: Préparer les données (récupérer les posts Mastodon et les committer)
  prepare_job_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour que le script puisse modifier les fichiers Markdown

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère l'historique complet pour les opérations Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # La version de Python que vous utilisez

      - name: Install Python dependencies for jobs.py
        run: |
          python -m pip install --upgrade pip
          # Dépendances de jobs.py : requests, python-frontmatter, python-slugify, pytz
          pip install requests python-frontmatter python-slugify pytz

      - name: Run Mastodon Jobs script
        # Le fichier jobs.py est à la racine de votre dépôt
        run: python jobs.py 

      - name: Commit changes (new Mastodon posts)
        # Cette étape va committer les fichiers .md créés/mis à jour par jobs.py
        # et les pousser vers votre branche 'main'.
        # CE PUSH DÉCLENCHERA LE JOB 'build_and_deploy' CI-DESSOUS.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add _jobs/ # Ajoutez le dossier _jobs/ pour inclure les fichiers générés
          git commit -m "Automatisation: Mise à jour des offres d'emploi Mastodon" || echo "No new job posts to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Utilise le jeton par défaut de GitHub Actions


  # Job 2: Construire et Déployer le site Jekyll sur GitHub Pages
  # Ce job s'exécutera APRÈS LE PUSH du job 'prepare_job_data'.
  # Il est crucial que ce job soit configuré pour écouter les pushes sur la branche 'main'.
  build_and_deploy:
    runs-on: ubuntu-latest
    # Le 'needs' ici est facultatif si le job est déclenché par le push.
    # Il assure que 'prepare_job_data' a fini de s'exécuter avant que ce job ne s'exécute,
    # mais ce job ne s'exécutera pas si le push ne se produit pas.
    # Dans ce cas précis, le push est le déclencheur primaire.
    # needs: prepare_job_data # Garder ceci si vous voulez une dépendance explicite dans le même workflow run.

    # Configuration de l'environnement de déploiement GitHub Pages
    environment:
      name: github-pages # Nom d'environnement spécial requis par actions/deploy-pages
    
    # Permissions spécifiques pour le déploiement sur GitHub Pages
    permissions:
      contents: write # Nécessaire pour checkout et pour l'étape de déploiement
      pages: write    # Nécessaire pour déployer sur GitHub Pages
      id-token: write # Nécessaire pour l'authentification avec OIDC pour GitHub Pages

    steps:
      - name: Checkout code (after data preparation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour l'historique Git si vous faites des opérations de push

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.1' # Version de Ruby stable et disponible
          bundler-cache: true # Installe les dépendances Gemfile avec Bundler

      - name: Build Jekyll site
        # Cette étape exécute Jekyll avec tous vos plugins (même non supportés par GitHub Pages)
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        # Cette étape prend le site Jekyll déjà construit (_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site # Chemin du dossier Jekyll construit

      - name: Deploy to GitHub Pages
        # Cette étape déploie l'artefact statique sur GitHub Pages
        uses: actions/deploy-pages@v4