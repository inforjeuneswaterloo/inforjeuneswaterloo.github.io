# .github/workflows/bluesky_frequent_publisher.yml
name: Publication Bluesky Fréquente

on:
  schedule:
    - cron: '*/5 * * * *' 

  workflow_dispatch:

jobs:
  publish_bluesky_posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Dépendances pour bsky.py : PyYAML, atproto, html2text
          pip install PyYAML atproto html2text

      - name: Run Bluesky Publisher Script
        run: python scripts/bsky.py
        env:
          BSKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BSKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
