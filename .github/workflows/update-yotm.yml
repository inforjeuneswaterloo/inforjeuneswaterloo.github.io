name: "Mise à jour quotidienne du site (Branche yotm)"

on:
  schedule:
    # Exécution tous les jours à 23:00 UTC (01:00 heure locale UTC+2)
    - cron: '0 23 * * *'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branche à déployer'
        required: true
        default: 'yotm'

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest

    # Autorisation requise pour push les commits automatisés
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || 'yotm' }}

      - name: Configuration de Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Synchronisation du flux RSS
        run: ruby scripts/actu_mobilite_sync.rb
        
      - name: Commit et Push des fichiers JSON de données
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Indexation exclusive du dossier _data/
          git add _data/
          
          # Vérification isolée des modifications dans _data/
          if git diff --staged --quiet; then
            echo "Aucune modification dans _data/. Aucun commit nécessaire."
          else
            git commit -m "chore(data): auto-update RSS and Airtable data [skip ci]"
            git push
          fi

      - name: Trigger Build sur Netlify pour yotm
        run: |
          curl -X POST -d {} "https://api.netlify.com/build_hooks/6a8696a81d2178ee7df009b2"