# .github/workflows/daily_site_update.yml
name: Mise à jour quotidienne du Site (Mastodon, Bluesky & PDF)

on:
  schedule:
    # Exécute tous les jours à 15h00 UTC.
    # Pour Orp-Jauche (CEST - UTC+2), cela correspond à 17h00 en heure d'été.
    # En heure d'hiver (CET - UTC+1), cela correspondra à 16h00.
    - cron: '0 15 * * *' 

  workflow_dispatch: # Permet de lancer ce workflow manuellement depuis l'onglet Actions

jobs:
  # Job unique: Met à jour les données, construit et déploie le site
  update_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour modifier les fichiers (via git commit) et pour le déploiement
      pages: write    # Nécessaire pour déployer sur GitHub Pages
      id-token: write # Nécessaire pour l'authentification OIDC de GitHub Pages

    environment: # L'environnement de déploiement GitHub Pages
      name: github-pages 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère l'historique complet pour les opérations Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # La version de Python utilisée pour vos scripts

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Installe toutes les dépendances nécessaires pour jobs.py, bsky.py et generate_pdf.py
          pip install requests python-frontmatter python-slugify pytz PyYAML atproto html2text pdfkit

      # --- Étape 1: Exécuter le script Mastodon Jobs ---
      # Ce script nettoie '_jobs/', récupère les posts Mastodon du jour et les crée dans '_jobs/'.
      # Il génère aussi 'scripts/temp_jobs_for_pdf.json' pour le PDF.
      - name: Run Mastodon Jobs script (job4student)
        run: python scripts/jobs.py 
        env:
          # Assurez-vous que ces Secrets sont configurés dans les paramètres de votre dépôt GitHub
          MASTODON_USERNAME: ${{ secrets.MASTODON_USERNAME }}
          MASTODON_PASSWORD: ${{ secrets.MASTODON_PASSWORD }} # Ou MASTODON_ACCESS_TOKEN

      # --- Étape 2: Installer wkhtmltopdf (requis par pdfkit) ---
      - name: Install wkhtmltopdf for PDF generation
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf

      # --- Étape 3: Générer le PDF (sans envoi d'email) ---
      # Ce script lit 'scripts/temp_jobs_for_pdf.json' et génère le PDF dans 'assets/downloads/jobs/archives/'.
      # Assurez-vous que le nom du fichier Python est correct (generate_pdf.py ou generate_pdf_and_email.py)
      - name: Generate Job Offers PDF
        run: python scripts/generate_pdf.py # <--- VÉRIFIEZ CE NOM DE FICHIER

      # --- NOUVELLE ÉTAPE : Nettoyage mensuel des archives PDF ---
      - name: Monthly cleanup of PDF archives
        run: |
          # Supprime les fichiers PDF plus anciens qu'un mois dans le dossier des archives.
          find assets/downloads/jobs/archives/ -type f -name "*.pdf" -mtime +30 -delete
          echo "Anciens fichiers PDF supprimés (plus d'un mois)."

      # --- Étape 4: Exécuter le script Bluesky Publisher ---
      # Ce script nettoie '_news/', récupère les posts Bluesky et les crée dans '_news/'.
      - name: Run Bluesky Publisher Script
        run: python scripts/bsky.py
        env:
          # Assurez-vous que ces Secrets sont configurés dans les paramètres de votre dépôt GitHub
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      # --- Étape 5: Commiter tous les changements effectués par les scripts ---
      # Ce commit est fait par le robot GitHub Actions.
      # Il met à jour votre branche 'main' avec les nouveaux fichiers de contenu et le PDF.
      - name: Commit all content changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          # Ajoutez TOUS les dossiers que vos scripts peuvent modifier, y compris le chemin du PDF
          git add _jobs/ _news/ assets/downloads/jobs/archives/ 
          git commit -m "Automatisation: Mise à jour quotidienne du contenu du site et du PDF" || echo "No content changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Étape 6: Construire le site Jekyll ---
      - name: Checkout code (after content update for build)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.1' 
          bundler-cache: true 

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4