# .github/workflows/daily_site_update.yml
name: Mise à jour quotidienne du Site (Mastodon & Bluesky)

on:
  schedule:
    # Exécute tous les jours à 15h00 UTC.
    # Pour Orp-Jauche (CEST - UTC+2), cela correspond à 17h00 en heure d'été.
    # En heure d'hiver (CET - UTC+1), cela correspondra à 16h00.
    - cron: '0 15 * * *' 

  workflow_dispatch: # Permet de lancer ce workflow manuellement

jobs:
  # Job unique: Update data & Build & Deploy site
  update_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour modifier les fichiers et pour le déploiement
      pages: write    # Nécessaire pour déployer sur GitHub Pages
      id-token: write # Nécessaire pour l'authentification OIDC de GitHub Pages

    environment: # L'environnement de déploiement GitHub Pages
      name: github-pages 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère l'historique complet pour les opérations Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # La version de Python que vous utilisez

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Installe toutes les dépendances nécessaires pour jobs.py ET bsky.py
          # - requests, python-frontmatter, python-slugify, pytz (pour jobs.py)
          # - PyYAML, atproto, html2text (pour bsky.py)
          pip install requests python-frontmatter python-slugify pytz PyYAML atproto html2text

      # --- Étape 1: Exécuter le script Mastodon Jobs (dans scripts/jobs.py) ---
      - name: Run Mastodon Jobs script
        run: python scripts/jobs.py 
        env:
          # Assurez-vous que ces Secrets sont configurés dans les paramètres de votre dépôt GitHub
          MASTODON_USERNAME: ${{ secrets.MASTODON_USERNAME }}
          MASTODON_PASSWORD: ${{ secrets.MASTODON_PASSWORD }} # Ou MASTODON_ACCESS_TOKEN

      # --- Étape 2: Exécuter le script Bluesky Publisher (dans scripts/bsky.py) ---
      - name: Run Bluesky Publisher Script
        run: python scripts/bsky.py
        env:
          # Assurez-vous que ces Secrets sont configurés dans les paramètres de votre dépôt GitHub
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      # --- Étape de DÉBOGAGE TEMPORAIRE : Affiche la longueur des identifiants Bluesky ---
      # Cette étape est temporaire pour le débogage et doit être supprimée une fois le problème résolu.
      # Elle vérifie si les Secrets sont correctement injectés en affichant leur longueur.
      - name: Debug Bluesky Credentials (TEMPORARY STEP)
        run: |
          echo "--- DEBUG BLUESKY CREDENTIALS ---"
          # Assign secrets to shell variables first, then get their length using Bash syntax.
          BLUESKY_USERNAME_VAL="${{ secrets.BLUESKY_USERNAME }}"
          BLUESKY_APP_PASSWORD_VAL="${{ secrets.BLUESKY_APP_PASSWORD }}"

          echo "BLUESKY_USERNAME length: ${#BLUESKY_USERNAME_VAL}"
          echo "BLUESKY_APP_PASSWORD length: ${#BLUESKY_APP_PASSWORD_VAL}"
          echo "--- END DEBUG ---"
      # --- FIN DE L'ÉTAPE DE DÉBOGAGE TEMPORAIRE ---


      # --- Étape 3: Commiter tous les changements effectués par les scripts ---
      - name: Commit all content changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          # Ajoutez TOUS les dossiers que vos scripts peuvent modifier
          git add _jobs/ _news/ 
          git commit -m "Automatisation: Mise à jour quotidienne du contenu du site" || echo "No content changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Utilise le jeton par défaut de GitHub Actions

      # --- Étape 4: Construire le site Jekyll ---
      # Cette étape s'exécute après le commit/push des changements.
      # Le GITHUB_TOKEN par défaut ne déclenche pas un nouveau run de workflow lors du push,
      # donc la construction se poursuit dans le même run.
      - name: Checkout code (after content update for build)
        # Re-checkout pour s'assurer d'avoir les derniers fichiers committés pour le build
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.1' # Version de Ruby stable et disponible
          bundler-cache: true 

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4