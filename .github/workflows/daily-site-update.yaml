# .github/workflows/daily_site_update.yml
name: Mise à jour quotidienne du Site (Mastodon, Bluesky & PDF)

on:
  schedule:
    - cron: '0 15 * * *' # Tous les jours à 15h00 UTC

  workflow_dispatch:

jobs:
  update_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter python-slugify pytz PyYAML atproto html2text pdfkit

      - name: Run Mastodon Jobs script (job4student)
        run: python scripts/jobs.py
        env:
          MASTODON_USERNAME: ${{ secrets.MASTODON_USERNAME }}
          MASTODON_PASSWORD: ${{ secrets.MASTODON_PASSWORD }}

      - name: Install wkhtmltopdf for PDF generation
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf

      - name: Generate Job Offers PDF
        run: python scripts/generate_pdf.py

      # --- NOUVELLE ÉTAPE : Nettoyage mensuel des archives PDF ---
      - name: Monthly cleanup of PDF archives
        run: |
          # Supprime les fichiers PDF plus anciens qu'un mois dans le dossier des archives.
          find assets/downloads/jobs/archives/ -type f -name "*.pdf" -mtime +30 -delete
          echo "Anciens fichiers PDF supprimés (plus d'un mois)."

      - name: Run Bluesky Publisher Script
        run: python scripts/bsky.py
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      - name: Commit all content changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add _jobs/ _news/ assets/downloads/jobs/archives/
          git commit -m "Automatisation : Mise à jour quotidienne du contenu du site et du PDF (nettoyage mensuel des archives)" || echo "Aucun changement à commiter"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code (after content update for build)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.1'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4